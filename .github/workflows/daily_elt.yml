name: Pipeline ELT Financier (Snowflake + dbt)

on:
  # Exécution automatique du lundi au vendredi à 22h00 UTC (17h00 heure de l'Est)
  schedule:
    - cron: '0 22 * * 1-5'
  # Permet de déclencher le pipeline manuellement d'un clic sur GitHub
  workflow_dispatch:

jobs:
  elt-pipeline:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}

    steps:
      - name: 1. Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: 2. Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Installer Python, Snowpark et dbt-snowflake
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Extraire et charger les données brutes (BRONZE)
        run: python src/ingest_stocks.py

      - name: 5. Transformer les données avec dbt (SILVER et GOLD)
        working-directory: ./dbt_finance
        run: dbt run --profiles-dir .

      - name: 6. Valider la qualité des données avec dbt test
        working-directory: ./dbt_finance
        run: dbt test --profiles-dir .
